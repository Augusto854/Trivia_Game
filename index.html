<html>
<head>
    <title>THE BIG FAT GREEK TRIVIA GAME</title>
    <link rel="stylesheet" href="styles.css">
    <script src = "game.js" defer></script>
</head>
<body>
    <header class="game_header">
        <h1>The Ultimate Trivia Game</h1>
        <p>Kerää kaikki kategoriat</p>
    </header>

    <section class = "status-panel">
        <article class="player-card">
            <h2>Player</h2>
            <img src="Egg_Player.png" class="player-image">
            <p>Kerätyt aihealueet: 0/6</p>
        </article>
        <article class="dice-panel">
            <p>Turn:</p>
            <h2>Player</h2>
            <button>Throw the dice</button>

            <div id="board" class="board">tähän tulee pelilauta</div>
        </article>
        <article class="player-card">
            <h2>The evil GPT</h2>
            <img src="Evil_AI.png" class="AI-image">
            <p>Kerätyt aihealueet: 0/6</p>
        </article>
    </section>
</body>
</html>
